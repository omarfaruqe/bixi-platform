[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bixi-platform"
version = "0.1.0"
description = "Montréal BIXI demand forecasting and rebalancing platform (bilingual EN/FR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "babel>=2.14",
]

[project.optional-dependencies]
# Install only what the current step needs: pip install -e ".[app,dev]"
app = ["streamlit>=1.40", "plotly>=5.24", "pydeck>=0.9"]
data = ["polars>=1.0", "pyarrow>=16", "duckdb>=1.0", "httpx>=0.27"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.5", "mlflow>=2.16"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "geoalchemy2>=0.15"]
opt = ["ortools>=9.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bixi = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
