services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      BIXI_DATA_DIR: /data
    volumes:
      - ./data:/data

  # PostgreSQL + PostGIS is not needed until Step 7.
  # Start it with: docker compose --profile db up -d db
  db:
    image: postgis/postgis:16-3.4
    profiles: ["db"]
    environment:
      POSTGRES_USER: bixi
      POSTGRES_PASSWORD: bixi
      POSTGRES_DB: bixi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
