services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      BIXI_DATA_DIR: /data
    volumes:
      - ./data:/data

  # Local forecast database for development (Step 7); the server uses deploy/docker-compose.yml.
  # Start it with: docker compose --profile db up -d db
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: bixi
      POSTGRES_PASSWORD: bixi
      POSTGRES_DB: bixi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
